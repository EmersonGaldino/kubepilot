appId: com.kubepilot.app
productName: KubePilot
copyright: Copyright © 2026 KubePilot

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!**/node_modules/**'

asarUnpack:
  - dist/**/*
  - dist-electron/preload.js

npmRebuild: false

# electron-updater reads this same block (via the packaged app-update.yml)
# to know where to look for new versions. If the repo is/becomes private,
# add `private: true` here and make sure a GH_TOKEN with repo access is
# present wherever the build runs (the GitHub Actions workflow already
# gets one for free via `secrets.GITHUB_TOKEN`).
publish:
  provider: github
  owner: EmersonGaldino
  repo: kubepilot

extraResources:
  - from: build/trayTemplate.png
    to: trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: trayTemplate@2x.png
  - from: build/trayTemplate@3x.png
    to: trayTemplate@3x.png

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icon.icns
  # Unsigned local builds cannot use hardened runtime — macOS kills the
  # process on launch. Re-enable together with a Developer ID + notarization.
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null

dmg:
  title: 'KubePilot ${version}'
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
  # electron-builder generates the .ico from this PNG (needs to be >=256px)
  # so there's no separately-maintained Windows icon asset to go stale.
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: Development
