name: Build installers

# Every push builds the Windows/Linux/macOS installers on their native
# runners (electron-builder can't reliably cross-compile a signed-looking
# NSIS/dmg from a foreign host) and attaches them as downloadable workflow
# artifacts. Pushing a `v*` tag additionally publishes those same installers
# to a single GitHub Release — that's the feed `electron-updater` polls in
# UpdateService, so a tagged push is what actually ships an update to users.
#
# The three platform jobs never call electron-builder's own `--publish`
# themselves: running that concurrently across a matrix is a known race
# (each job's electron-builder tries to create the release for the tag at
# the same time, and — since it doesn't exist yet — several of them "win",
# leaving multiple duplicate drafts with the assets split across them).
# Instead every job only builds (`--publish never`) and uploads its output
# as a workflow artifact; a single `release` job downloads all three and
# creates/publishes one release, so there's exactly one place assets land.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-name: mac
          - os: windows-latest
            artifact-name: win
          - os: ubuntu-latest
            artifact-name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # OFFICIAL_BUILD_KEY authorizes this build to actually run — see
      # `isOfficialBuild()` in electron/main.ts. Only present here (a repo
      # secret) and in an authorized maintainer's untracked `.env.local`.
      - name: Build renderer + main
        run: npm run build
        env:
          OFFICIAL_BUILD_KEY: ${{ secrets.OFFICIAL_BUILD_KEY }}

      # electron-builder still writes the update-metadata yml files
      # (latest.yml / latest-mac.yml / latest-linux*.yml) locally even
      # with publishing disabled — the `release` job below is what
      # actually uploads everything to GitHub.
      - name: Package
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: kubepilot-${{ matrix.artifact-name }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/*.yml
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kubepilot-*
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Idempotent: creates the release the first time a tag is pushed,
        # or just re-uploads (clobbering same-named assets) if the workflow
        # is re-run against a tag that already has one.
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" release/* \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              release/*
          fi
