name: Build installers

# Every push builds the Windows/Linux/macOS installers on their native
# runners (electron-builder can't reliably cross-compile a signed-looking
# NSIS/dmg from a foreign host) and attaches them as downloadable workflow
# artifacts. Pushing a `v*` tag additionally publishes those same installers
# to a GitHub Release — that's the feed `electron-updater` polls in
# UpdateService, so a tagged push is what actually ships an update to users.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-name: mac
          - os: windows-latest
            artifact-name: win
          - os: ubuntu-latest
            artifact-name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build renderer + main
        run: npm run build

      # Publishes to the release matching this tag only when the trigger
      # was a `v*` tag push; every other push just produces the artifacts
      # below without touching GitHub Releases.
      - name: Package (publish on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package (build only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: kubepilot-${{ matrix.artifact-name }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
          if-no-files-found: ignore
