appId: com.kubepilot.app
productName: KubePilot
copyright: Copyright © 2026 KubePilot

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!**/node_modules/**'

asarUnpack:
  - dist/**/*
  - dist-electron/preload.js

npmRebuild: false

# electron-updater reads this same block (via the packaged app-update.yml)
# to know where to look for new versions — requires a public repo, since
# a private one's release assets need an authenticated request that a
# distributed app can't carry a secret for.
publish:
  provider: github
  owner: EmersonGaldino
  repo: kubepilot

extraResources:
  - from: build/trayTemplate.png
    to: trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: trayTemplate@2x.png
  - from: build/trayTemplate@3x.png
    to: trayTemplate@3x.png

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icon.icns
  # No ${version} on purpose: keeps a stable filename so the README can link
  # straight to GitHub's `/releases/latest/download/<name>` for each
  # platform/arch instead of a version-specific URL that goes stale.
  artifactName: '${productName}-mac-${arch}.${ext}'
  # Unsigned local builds cannot use hardened runtime — macOS kills the
  # process on launch. Re-enable together with a Developer ID + notarization.
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null

dmg:
  title: 'KubePilot ${version}'
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
  # electron-builder generates the .ico from this PNG (needs to be >=256px)
  # so there's no separately-maintained Windows icon asset to go stale.
  icon: build/icon.png
  # See the `mac.artifactName` comment — same stable-filename reasoning.
  artifactName: '${productName}-win-${arch}.${ext}'

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: Development
  # See the `mac.artifactName` comment — same stable-filename reasoning.
  artifactName: '${productName}-linux-${arch}.${ext}'
